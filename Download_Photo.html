<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Interview Photo - Avnish Kumar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h2 {
            color: #1a365d;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 22px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .photo-box {
            margin: 0 auto 22px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            max-width: 320px;
            border: 3px solid #e2e8f0;
        }
        .photo-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn-download {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-download:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
        }
        .tip {
            margin-top: 15px;
            font-size: 12.5px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>आपकी इंटरव्यू फ़ोटो तैयार है! ✨</h2>
    <p>नीचे दिए गए बटन से फ़ोटो डाउनलोड करें या राइट-क्लिक करके सेव करें:</p>

    <div class="photo-box">
        <img id="targetPhoto" src="file:///C:/Users/LENOVO/.gemini/antigravity/brain/61f9aa41-07e7-41f9-9745-a468b2f970ef/beard_open_suit_1789732491685.jpg" alt="Avnish Interview Photo">
    </div>

    <a id="downloadLink" class="btn-download" href="file:///C:/Users/LENOVO/.gemini/antigravity/brain/61f9aa41-07e7-41f9-9745-a468b2f970ef/beard_open_suit_1789732491685.jpg" download="Avnish_Interview_Photo.jpg">
        ⬇️ Download Photo (डाउनलोड)
    </a>

    <div class="tip">
        (अगर बटन दबाने पर डाउनलोड न हो, तो फ़ोटो पर राइट-क्लिक करके <b>"Save image as"</b> कर लें)
    </div>
</div>

<script>
    // Convert to canvas blob for automatic force download if local file URL blocked
    document.getElementById('downloadLink').addEventListener('click', function(e) {
        const img = document.getElementById('targetPhoto');
        try {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'Avnish_Interview_Photo.jpg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            e.preventDefault();
        } catch(err) {
            // allows default link action
        }
    });
</script>

</body>
</html>
